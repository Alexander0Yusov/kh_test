# Local infrastructure only. Docker Compose uses the root `.env` exclusively
# for `${...}` interpolation; backend applications load common then service env.
services:
  dzencode-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - dzencode-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d postgres']
      interval: 2s
      timeout: 5s
      retries: 15

  dzencode-localstack:
    image: localstack/localstack:4.11.1
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: 1
      STORAGE_CORS_ALLOWED_ORIGIN: http://localhost:4200
    ports:
      - '127.0.0.1:${LOCALSTACK_PORT}:4566'
    volumes:
      - dzencode-localstack-data:/var/lib/localstack
      - ./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -fs http://localhost:4566/_localstack/init/ready | grep -q SUCCESSFUL",
        ]
      interval: 3s
      timeout: 5s
      retries: 30

  dzencode-rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - '127.0.0.1:${RABBITMQ_AMQP_PORT}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT}:15672'
    volumes:
      - dzencode-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 3s
      timeout: 5s
      retries: 20

  dzencode-redis:
    image: redis:8.8.1-alpine
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--appendfsync',
        'everysec',
      ]
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - dzencode-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  dzencode-postgres-data:
  dzencode-localstack-data:
  dzencode-rabbitmq-data:
  dzencode-redis-data:
